services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: linkfire-music-library-migrate:local
    container_name: linkfire-music-library-migrate
    command: ["--connection", "Data Source=/data/musiclibrary.db"]
    volumes:
      - musiclibrary-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: linkfire-music-library:local
    container_name: linkfire-music-library
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MusicLibrary: "Data Source=/app/data/musiclibrary.db"
      Database__MigrateOnStartup: "false"
      Deezer__BaseUrl: "https://api.deezer.com/"
      Deezer__AttemptTimeoutSeconds: "5"
      Deezer__TotalTimeoutSeconds: "15"
      Deezer__MaxRetries: "2"
    volumes:
      - musiclibrary-data:/app/data
    restart: unless-stopped

volumes:
  # Named volume keeps the SQLite database between `docker compose down` / `up`.
  # Remove it with `docker compose down -v` to start from an empty library.
  musiclibrary-data:
